  </defs>
  <rect width="1120" height="1440" fill="url(#bg)"/>
  <ellipse cx="710" cy="505" rx="250" ry="315" fill="#c3c2bd"/>
  <path d="M275 1440c25-440 203-680 488-680s390 243 357 680H275Z" fill="#75746f"/>
  <path d="M505 470c50-185 198-260 346-130 12 155-27 294-157 347-128-45-196-122-189-217Z" fill="#b0afa9"/>
  <rect width="1120" height="1440" filter="url(#grain)" opacity=".46"/>
